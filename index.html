    <!-- Loaded non-render-blocking: a plain <link rel="stylesheet"> here
         blocks first paint until the (cross-origin) CSS arrives. Fetching
         it as a "print" stylesheet lets the browser treat it as low
         priority and non-blocking, then the onload flips it to apply — the
         same effect, ~1.8s faster first paint (measured via PageSpeed
         Insights). display=swap in the URL keeps text visible in a
         fallback font in the meantime, and the <noscript> covers browsers
         with JS disabled. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
